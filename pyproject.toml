[project]
name = "agentic-legacy-modernization-poc"
version = "0.1.0"
description = "PoC for agentic modernization of COBOL legacy systems using Microsoft Azure AI Foundry"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "azure-ai-projects>=2.6.0",
    "azure-identity>=1.25.0",
    "openai>=3.8.0,<4.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals/tests"]
pythonpath = [".", "src"]
markers = [
    "live: marks tests that connect to live Azure AI Foundry (excluded by default)",
]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "."
exclude = [
    "^\\.venv/",
    "^artifacts/",
]

